spring.application.name=CareerPlatform

# Server Port (Render sets dynamic PORT; defaults to 8082)
server.port=${PORT:8082}

# PostgreSQL Database Configuration for Cloud Deployment (No credentials committed)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate JPA Auto DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration (comma-separated origins; defaults to local Vite development ports)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Gemini AI Configuration
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api-key=${GEMINI_API_KEY:}
